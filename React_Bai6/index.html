<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>React CRUD - Quản lý người dùng</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f3f6fa;color:#182437}.container{max-width:1200px;margin:38px auto;padding:0 20px}h1{font-size:29px;margin:0 0 6px}.subtitle{color:#65758b;margin-bottom:25px}.panel{background:white;border:1px solid #dfe6f0;border-radius:12px;padding:24px;box-shadow:0 4px 18px #1c365008}.toolbar{display:flex;gap:12px;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap}.search{min-width:250px;flex:1;max-width:480px}.input{padding:11px 12px;border:1px solid #cbd5e1;border-radius:7px;font-size:14px;width:100%}.input:focus{outline:2px solid #bfdbfe;border-color:#2563eb}button{border:0;border-radius:7px;padding:10px 14px;cursor:pointer;font-weight:600;background:#2563eb;color:white}button:hover{filter:brightness(.95)}button.delete{background:#dc2626}button.secondary{background:#e2e8f0;color:#334155}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:13px 11px;border-bottom:1px solid #e7edf5}th{background:#f7f9fc;color:#475569;font-size:13px}tr:hover td{background:#fbfcff}.actions{display:flex;gap:7px}td button{padding:7px 10px;font-size:12px}.muted{color:#64748b}.status{padding:18px;text-align:center}.error{color:#b91c1c}.overlay{position:fixed;inset:0;background:#0f172a7a;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modal{width:min(600px,100%);max-height:92vh;overflow:auto;background:white;padding:26px;border-radius:12px;box-shadow:0 18px 55px #0f172a33}.modal h2{margin:0 0 20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.counter{color:#64748b;margin-bottom:12px;font-size:13px}@media(max-width:650px){.fields{grid-template-columns:1fr}.container{margin:18px auto}.panel{padding:14px}}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const EMPTY_USER = {name:'',username:'',email:'',address:{street:'',suite:'',city:''},phone:'',website:''};
const FIELDS = [['name','Name *'],['username','Username *'],['email','Email'],['street','Street'],['suite','Suite'],['city','City'],['phone','Phone'],['website','Website']];
function UserFields({user,onChange}) {
  return <div className="fields">{FIELDS.map(([id,label])=><div className="field" key={id}>
    <label htmlFor={id}>{label}</label><input className="input" id={id} value={['street','suite','city'].includes(id)?user.address?.[id]??'':user[id]??''} onChange={e=>onChange(id,e.target.value)}/>
  </div>)}</div>;
}
function updateField(prev,id,value){return ['street','suite','city'].includes(id)?{...prev,address:{...prev.address,[id]:value}}:{...prev,[id]:value};}
function SearchForm({onChangeValue}){return <input className="input search" type="text" placeholder="Tìm theo name, username..." onChange={e=>onChangeValue(e.target.value)}/>;}
function AddUser({onAdd}){
 const [adding,setAdding]=React.useState(false);const [user,setUser]=React.useState(EMPTY_USER);
 function handleAdd(e){e.preventDefault();if(!user.name.trim()||!user.username.trim()){alert('Vui lòng nhập Name và Username!');return;}onAdd({...user,address:{...user.address}});setUser(EMPTY_USER);setAdding(false);}
 return <><button onClick={()=>setAdding(true)}>+ Thêm người dùng</button>{adding&&<div className="overlay" onMouseDown={e=>{if(e.target===e.currentTarget)setAdding(false)}}><form className="modal" onSubmit={handleAdd}><h2>Thêm người dùng</h2><UserFields user={user} onChange={(id,value)=>setUser(prev=>updateField(prev,id,value))}/><div className="modal-actions"><button type="button" className="secondary" onClick={()=>setAdding(false)}>Hủy</button><button type="submit">Thêm</button></div></form></div>}</>;
}
function ResultTable({keyword,user,onAdded}){
 const [users,setUsers]=React.useState([]);const [loading,setLoading]=React.useState(true);const [error,setError]=React.useState('');const [editing,setEditing]=React.useState(null);
 React.useEffect(()=>{let active=true;fetch('https://jsonplaceholder.typicode.com/users').then(res=>{if(!res.ok)throw new Error('HTTP '+res.status);return res.json()}).then(data=>{if(active){setUsers(data);setLoading(false)}}).catch(err=>{if(active){setError('Không tải được dữ liệu: '+err.message);setLoading(false)}});return ()=>{active=false}},[]);
 React.useEffect(()=>{if(user){setUsers(prev=>[...prev,{...user,id:Math.max(0,...prev.map(u=>Number(u.id)||0))+1}]);onAdded();}},[user,onAdded]);
 function editUser(u){setEditing({...u,address:{...u.address}})}
 function saveUser(e){e.preventDefault();if(!editing.name.trim()||!editing.username.trim()){alert('Vui lòng nhập Name và Username!');return;}setUsers(prev=>prev.map(u=>u.id===editing.id?editing:u));setEditing(null)}
 function removeUser(id){setUsers(prev=>prev.filter(u=>u.id!==id))}
 const kw=keyword.trim().toLowerCase();const filteredUsers=users.filter(u=>(u.name||'').toLowerCase().includes(kw)||(u.username||'').toLowerCase().includes(kw));
 if(loading)return <div className="status">Đang tải danh sách...</div>;
 return <><div className="counter">Hiển thị {filteredUsers.length} / {users.length} người dùng</div>{error&&<p className="error">{error}. Bạn vẫn có thể thêm người dùng mới.</p>}<div className="table-wrap"><table><thead><tr><th>ID</th><th>Họ tên</th><th>Username</th><th>Email</th><th>Địa chỉ</th><th>Số điện thoại</th><th>Thao tác</th></tr></thead><tbody>{filteredUsers.map(u=><tr key={u.id}><td>{u.id}</td><td>{u.name}</td><td>{u.username}</td><td>{u.email}</td><td>{[u.address?.street,u.address?.suite,u.address?.city].filter(Boolean).join(', ')}</td><td>{u.phone}</td><td><div className="actions"><button onClick={()=>editUser(u)}>Sửa</button><button className="delete" onClick={()=>removeUser(u.id)}>Xóa</button></div></td></tr>)}{!filteredUsers.length&&<tr><td colSpan="7" className="status muted">Không có người dùng phù hợp.</td></tr>}</tbody></table></div>
 {editing&&<div className="overlay" onMouseDown={e=>{if(e.target===e.currentTarget)setEditing(null)}}><form className="modal" onSubmit={saveUser}><h2>Sửa người dùng #{editing.id}</h2><UserFields user={editing} onChange={(id,value)=>setEditing(prev=>updateField(prev,id,value))}/><div className="modal-actions"><button type="button" className="secondary" onClick={()=>setEditing(null)}>Hủy</button><button type="submit">Lưu thay đổi</button></div></form></div>}</>;
}
function App(){const [kw,setKeyword]=React.useState('');const [newUser,setNewUser]=React.useState(null);const clearAdded=React.useCallback(()=>setNewUser(null),[]);return <div className="container"><h1>Quản lý người dùng</h1><p className="subtitle">Bài tập React CRUD — dữ liệu mẫu JSONPlaceholder</p><div className="panel"><div className="toolbar"><SearchForm onChangeValue={setKeyword}/><AddUser onAdd={setNewUser}/></div><ResultTable keyword={kw} user={newUser} onAdded={clearAdded}/></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
