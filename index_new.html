<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Assignment 01 của Nguyễn Minh Đăng về Domain, Hosting và GitHub."
    >

    <title>
        Assignment 01 - Nguyễn Minh Đăng
    </title>

    <!-- Google Fonts -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >


    <style>

        :root {
            --primary: #06b6d4;
            --secondary: #8b5cf6;
            --accent: #ec4899;

            --card-bg: rgba(17, 24, 39, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);

            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family:
                'Plus Jakarta Sans',
                sans-serif;
        }


        body {
            background: #090d16;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 24px;

            position: relative;

            overflow-x: hidden;
        }


        .glow-bg-1 {
            position: absolute;

            top: 15%;
            left: 20%;

            width: 320px;
            height: 320px;

            background:
                radial-gradient(
                    circle,
                    rgba(139, 92, 246, 0.28) 0%,
                    transparent 70%
                );

            filter: blur(60px);

            pointer-events: none;

            z-index: 0;
        }


        .glow-bg-2 {
            position: absolute;

            bottom: 15%;
            right: 20%;

            width: 350px;
            height: 350px;

            background:
                radial-gradient(
                    circle,
                    rgba(6, 182, 212, 0.25) 0%,
                    transparent 70%
                );

            filter: blur(60px);

            pointer-events: none;

            z-index: 0;
        }


        .card {
            position: relative;

            z-index: 1;

            width: 100%;

            max-width: 620px;

            background: var(--card-bg);

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            border:
                1px solid var(--card-border);

            border-radius: 28px;

            padding: 42px 36px;

            box-shadow:
                0 25px 60px -15px rgba(0, 0, 0, 0.7),
                0 0 40px -10px rgba(6, 182, 212, 0.15);

            text-align: center;
        }


        .badge {
            display: inline-flex;

            align-items: center;

            gap: 8px;

            background:
                rgba(6, 182, 212, 0.12);

            color: #38bdf8;

            border:
                1px solid rgba(56, 189, 248, 0.25);

            padding: 6px 16px;

            border-radius: 9999px;

            font-size: 0.82rem;

            font-weight: 700;

            letter-spacing: 0.5px;

            text-transform: uppercase;

            margin-bottom: 20px;
        }


        .badge-dot {
            width: 7px;
            height: 7px;

            background: #38bdf8;

            border-radius: 50%;

            box-shadow:
                0 0 8px #38bdf8;
        }


        h1 {
            font-size: 2.3rem;

            font-weight: 800;

            letter-spacing: -0.5px;

            margin-bottom: 10px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff 30%,
                    #67e8f9 70%,
                    #c084fc 100%
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        .topic {
            color: #cbd5e1;

            font-size: 1.15rem;

            font-weight: 600;

            margin-bottom: 24px;
        }


        .profile-pill {
            background:
                rgba(255, 255, 255, 0.04);

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 16px;

            padding: 16px 20px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 26px;

            text-align: left;
        }


        .user-meta {
            display: flex;

            align-items: center;

            gap: 12px;
        }


        .avatar {
            width: 44px;
            height: 44px;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--secondary)
                );

            display: flex;

            align-items: center;

            justify-content: center;

            color: #fff;

            font-size: 1.15rem;

            box-shadow:
                0 4px 12px rgba(6, 182, 212, 0.3);
        }


        .user-meta h2 {
            font-size: 1.05rem;

            color: #fff;

            font-weight: 700;
        }


        .user-meta span {
            font-size: 0.82rem;

            color: var(--text-sub);
        }


        .status-tag {
            font-size: 0.8rem;

            font-weight: 600;

            color: #34d399;

            background:
                rgba(52, 211, 153, 0.12);

            border:
                1px solid rgba(52, 211, 153, 0.25);

            padding: 5px 12px;

            border-radius: 8px;

            display: flex;

            align-items: center;

            gap: 6px;
        }


        .info-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;

            margin-bottom: 30px;
        }


        .info-card {
            background:
                rgba(255, 255, 255, 0.03);

            border:
                1px solid rgba(255, 255, 255, 0.06);

            border-radius: 14px;

            padding: 16px 12px;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease;
        }


        .info-card:hover {
            transform:
                translateY(-2px);

            border-color:
                rgba(56, 189, 248, 0.35);
        }


        .info-icon {
            color: #38bdf8;

            font-size: 1.2rem;

            margin-bottom: 8px;
        }


        .label {
            font-size: 0.75rem;

            text-transform: uppercase;

            letter-spacing: 0.5px;

            color: var(--text-sub);

            margin-bottom: 4px;
        }


        .value {
            font-size: 0.85rem;

            font-weight: 600;

            color: #e2e8f0;

            word-break: break-all;
        }


        .action-group {
            display: flex;

            gap: 14px;
        }


        .btn {
            flex: 1;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            padding: 13px 20px;

            border-radius: 14px;

            font-size: 0.95rem;

            font-weight: 600;

            text-decoration: none;

            transition: all 0.25s ease;
        }


        .btn-glow {
            background:
                linear-gradient(
                    135deg,
                    #06b6d4 0%,
                    #3b82f6 100%
                );

            color: #fff;

            box-shadow:
                0 4px 20px
                rgba(6, 182, 212, 0.4);
        }


        .btn-glass {
            background:
                rgba(255, 255, 255, 0.05);

            border:
                1px solid rgba(255, 255, 255, 0.12);

            color: #e2e8f0;
        }


        @media (max-width: 580px) {

            .card {
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.85rem;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .action-group {
                flex-direction: column;
            }
        }

    </style>

</head>


<body>

    <!-- Background decoration -->
    <div
        class="glow-bg-1"
        aria-hidden="true">
    </div>

    <div
        class="glow-bg-2"
        aria-hidden="true">
    </div>


    <!-- Nội dung chính -->
    <main class="card">

        <!-- Header -->
        <header>

            <div class="badge">
                <span class="badge-dot"></span>
                Assignment 01
            </div>

            <h1>
                Assignment 01
            </h1>

            <p class="topic">
                Domain • Hosting • GitHub
            </p>

        </header>


        <!-- Thông tin sinh viên -->
        <section
            class="profile-pill"
            aria-label="Thông tin sinh viên">

            <div class="user-meta">

                <div class="avatar">
                    <i class="fa-solid fa-user-check"></i>
                </div>

                <div>

                    <h2>
                        Nguyễn Minh Đăng
                    </h2>

                    <span>
                        Sinh viên thực hiện
                    </span>

                </div>

            </div>


            <div class="status-tag">

                <i class="fa-solid fa-circle-check"></i>

                Hoàn thành

            </div>

        </section>


        <!-- Thông tin hệ thống -->
        <section
            class="info-grid"
            aria-label="Thông tin hệ thống">


            <article class="info-card">

                <div class="info-icon">
                    <i class="fa-solid fa-globe"></i>
                </div>

                <div class="label">
                    Domain
                </div>

                <div class="value">
                    nguyenminhdang21.id.vn
                </div>

            </article>


            <article class="info-card">

                <div class="info-icon">
                    <i class="fa-solid fa-server"></i>
                </div>

                <div class="label">
                    Hosting
                </div>

                <div class="value">
                    GitHub Pages
                </div>

            </article>


            <article class="info-card">

                <div class="info-icon">
                    <i class="fa-solid fa-code-branch"></i>
                </div>

                <div class="label">
                    Version Control
                </div>

                <div class="value">
                    Git & GitHub
                </div>

            </article>

        </section>


        <!-- Navigation -->
        <nav
            class="action-group"
            aria-label="Liên kết">


            <a
                href="https://github.com/minhnoluv1234/assignment01-web"
                target="_blank"
                rel="noopener noreferrer"
                class="btn btn-glass">

                <i class="fa-brands fa-github"></i>

                Repository

            </a>


            <a
                href="http://nguyenminhdang21.id.vn"
                class="btn btn-glow">

                <i class="fa-solid fa-arrow-up-right-from-square"></i>

                Tên miền cá nhân

            </a>

        </nav>

    </main>

</body>

</html>
